# Ruff configuration file

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Assume Python 3.11
target-version = "py311"

[lint]
# Enable flake8-bugbear (`B`) rules.
select = ["E", "F", "W", "I", "B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ignore specific rules
ignore = [
    # Line too long (handled by formatter)
    "E501",
    # Function call in argument defaults (common in FastAPI)
    "B008",
    # Loop control variable not used within loop body
    "B007",
    # Function definition does not bind loop variable
    "B023",
    # Mutable data structures for argument defaults
    "B006",
]

[lint.per-file-ignores]
# Ignore imported but unused in __init__.py files
"__init__.py" = ["F401"]
# Ignore line length and whitespace in notebooks
"notebooks/*.ipynb" = ["E501", "W293"]

[lint.isort]
known-first-party = ["api", "src", "tests"] 